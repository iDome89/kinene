services:
  - type: web
    name: kinene
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true

    # Free-tier preview: set `plan: free` and delete the `disk:` block below.
    # The app still runs, but /var/data is ephemeral — bookings AND uploaded photos
    # are lost on every redeploy and whenever the free instance sleeps. Fine to
    # show the site, not fine for real customers.
    disk:
      name: kinene-data
      mountPath: /var/data
      sizeGB: 2

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/var/data/kinene.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      # Chiave da resend.com/api-keys
      - key: RESEND_API_KEY
        sync: false
      # Il dominio del mittente deve essere verificato in Resend
      - key: MAIL_FROM
        value: Kinene <prenotazioni@kinene.it>
